name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Kernel
        run: bash build.sh

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: spes
          path: /home/runner/work/kernel_xiaomi_sm6225/kernel_xiaomi_sm6225/anykernel
